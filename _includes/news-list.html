{% assign posts = site.posts %}
{% if include.limit %}
  {% assign posts = site.posts | slice: 0, include.limit %}
{% endif %}
<ul class="news-list">
  {% for post in posts %}
    <li>
      <span class="news-date">{{ post.date | date: "%b %Y" }}</span>
      <span class="news-text">{{ post.content | markdownify | remove: "<p>" | remove: "</p>" | strip }}</span>
    </li>
  {% endfor %}
</ul>
